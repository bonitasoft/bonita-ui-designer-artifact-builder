name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (leave empty to use pom version)
        type: string
        default: ""
        required: false
      nextVersion:
        description: "Next development version (leave empty to use default version increment policy)"
        type: string
        required: false
        default: ""
      skipMergeReleaseInMaster:
        description: "Whether release branch merge should be skip into master (major/minor version only should be merged)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Release pipeline
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: bonitasoft/git-setup-action@v1
        with:
          keeper-secret-config: ${{ secrets.KSM_CONFIG }}

      - name: Create Release
        env:
          OPENSSL_CONF: /dev/null # Disable OpenSSL config to let phantomjs start, see https://stackoverflow.com/a/72679175
        run: >
          ./mvnw -ntp --batch-mode gitflow:release
          -DgitFlowConfig.developmentBranch=${{ github.ref_name }}
          -DdevelopmentVersion=${{ github.event.inputs.nextVersion }}
          -DreleaseVersion=${{ github.event.inputs.version }}
          -DskipReleaseMergeProdBranch=${{ github.event.inputs.skipMergeReleaseInMaster }}
          -Dstyle.color=always
